    <div class="page page5" id="page5">
      <button class="close-btn-overlay" onclick="window.close()">(X)</button>
      <video autoplay loop muted>
        <source src="video/eng05.mp4" type="video/mp4" />

      </video>
      <div class="nav">
        <button id="listen05" onclick="playAudio('audio05')">(listen)</button>
      </div>
      <div class="page-text">
        <p>
          Thoughts in the back of my mind.<br>
          Is it yellow?<br>
          Is it white?<br>
          Shouldn’t it be blue?<br>
          A powder blue…<br>
          Is it the opening?<br>
          Is it ending itself?<br>
          Are they coming home or leaving it?<br>
          I seek no answer.<br>
          I seek nothing now.<br>
          A pleasant emptiness.<br>
        </p>
      </div>
    </div>

      <source src="audio/eng05.mp3" />
